<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" width="1100" height="530" role="img" aria-label="Where nullius intervenes. At SessionStart and after compaction it tells you what is open, what was read only to an abstract, and what you already buried. On a write to a draft it refuses an identifier that resolves to nothing, a retracted source, or a surname credited with no reference behind it. At Stop it refuses to end the turn while the acceptance check fails, a claim outruns the reading, or a finding is neither answered nor waived. A fact exits 2 and the turn does not end. A threshold somebody chose is reported through systemMessage and the turn ends.">
  <style>
    .plate { fill:#F4F6F8 }
    .hair  { stroke:#C9D3DB; stroke-width:1 }
    .spine { stroke:#5A6B7C; stroke-width:1.5 }
    .stop  { stroke:#B3413E; stroke-width:3.5; stroke-linecap:round }
    .tell  { stroke:#5A6B7C; stroke-width:3.5; stroke-linecap:round }
    .tick  { stroke:#A9B7C2; stroke-width:1.5; stroke-linecap:round }
    .tickr { stroke:#B3413E; stroke-width:1.5; stroke-linecap:round }
    .h     { fill:#16202B; font:600 15.5px ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
    .c     { fill:#39485A; font:400 13.5px ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
    .m     { fill:#5A6B7C; font:400 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
    .mr    { fill:#B3413E; font:500 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
    .eb    { fill:#8496A6; font:500 11px ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; letter-spacing:.09em }
    .k     { fill:#16202B; font:600 21px ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
    .lead  { fill:#16202B; font:500 14px ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
  </style>
  <rect class="plate" width="1100" height="530"/>

  <text class="eb" x="44" y="42">WHERE IT INTERVENES</text>
  <text class="k"  x="44" y="72">A session it cannot finish in</text>

  <line class="spine" x1="44" y1="156" x2="1046" y2="156"/>
  <polygon points="1056,156 1044,150.5 1044,161.5" fill="#5A6B7C"/>
  <text class="m" x="44" y="178">session</text>

  <line class="tell" x1="250" y1="134" x2="250" y2="178"/>
  <text class="m" x="250" y="124" text-anchor="middle">SessionStart · PostCompact</text>
  <text class="h" x="100" y="222">it tells you</text>
  <line class="tick" x1="100" y1="242" x2="112" y2="242"/><text class="c" x="122" y="246">what is open</text>
  <line class="tick" x1="100" y1="268" x2="112" y2="268"/><text class="c" x="122" y="272">what you read only to an abstract</text>
  <line class="tick" x1="100" y1="294" x2="112" y2="294"/><text class="c" x="122" y="298">what you already buried</text>
  <text class="m" x="100" y="328">one handler, both events</text>

  <line class="stop" x1="590" y1="134" x2="590" y2="178"/>
  <text class="m" x="590" y="124" text-anchor="middle">PreToolUse · Write|Edit</text>
  <text class="h" x="440" y="222">it refuses the write</text>
  <line class="tickr" x1="440" y1="242" x2="452" y2="242"/><text class="c" x="462" y="246">an identifier that resolves to nothing</text>
  <line class="tickr" x1="440" y1="268" x2="452" y2="268"/><text class="c" x="462" y="272">a retracted source</text>
  <line class="tickr" x1="440" y1="294" x2="452" y2="294"/><text class="c" x="462" y="298">a surname credited, nothing behind it</text>
  <text class="m" x="440" y="328">drafts only, and only what it can name</text>

  <line class="stop" x1="930" y1="134" x2="930" y2="178"/>
  <text class="m" x="930" y="124" text-anchor="middle">Stop</text>
  <text class="h" x="780" y="222">it refuses the ending</text>
  <line class="tickr" x1="780" y1="242" x2="792" y2="242"/><text class="c" x="802" y="246">the acceptance check still fails</text>
  <line class="tickr" x1="780" y1="268" x2="792" y2="268"/><text class="c" x="802" y="272">a claim outruns the reading</text>
  <line class="tickr" x1="780" y1="294" x2="792" y2="294"/><text class="c" x="802" y="298">a finding neither answered nor waived</text>

  <line class="hair" x1="44" y1="378" x2="1056" y2="378"/>
  <text class="eb" x="44" y="408">AND THE PART THAT KEEPS IT USABLE</text>

  <line class="stop" x1="46" y1="430" x2="46" y2="454"/>
  <text class="lead" x="66" y="442">a fact</text>
  <text class="mr"   x="300" y="442">exit 2</text>
  <text class="c"    x="470" y="442">the turn does not end, and the reason is the fact</text>

  <line class="tell" x1="46" y1="474" x2="46" y2="498"/>
  <text class="lead" x="66" y="486">a threshold somebody chose</text>
  <text class="m"    x="300" y="486">systemMessage</text>
  <text class="c"    x="470" y="486">reported, marked as chosen, and the turn ends</text>
</svg>
